[project]
name = "pygismeteo-base"
description = "Internal library for pygismeteo and aiopygismeteo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monosans", email = "hsyqixco@protonmail.com" }]
classifiers = [
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.16",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
urls.changelog = "https://github.com/monosans/pygismeteo-base/blob/main/CHANGELOG.md"
urls.issues = "https://github.com/monosans/pygismeteo-base/issues"
urls.repository = "https://github.com/monosans/pygismeteo-base"
dependencies = ["pydantic>=2.5", "typing-extensions>=4.4"]
dynamic = ["version"]

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.version]
path = "src/pygismeteo_base/__init__.py"

[tool.uv]
exclude-newer = "3 days"
